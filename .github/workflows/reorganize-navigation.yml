name: Reorganize navigation hierarchy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reorganize-navigation.yml'

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply navigation cleanup
        run: python scripts/reorganize_navigation.py
      - name: Build application
        run: npm ci && npm run build
      - name: Commit navigation cleanup
        run: |
          rm .github/workflows/reorganize-navigation.yml scripts/reorganize_navigation.py
          git config user.name "VerdoFamily Automation"
          git config user.email "actions@users.noreply.github.com"
          git add App.tsx .github/workflows/reorganize-navigation.yml scripts/reorganize_navigation.py
          git commit -m "Group navigation by daily family logic"
          git push
