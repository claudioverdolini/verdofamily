name: Apply Google Calendar integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-google-calendar-sync.yml'
      - 'scripts/apply_google_calendar_sync.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply patch
        run: python3 scripts/apply_google_calendar_sync.py

      - name: Validate build
        run: |
          npm install
          npm run build

      - name: Commit integration
        run: |
          rm .github/workflows/apply-google-calendar-sync.yml
          rm scripts/apply_google_calendar_sync.py
          git config user.name 'VerdoFamily Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate multi-user Google Calendar sync'
          git push
