name: Apply Google Calendar integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-google-calendar-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch VerdoFamily
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Patch point not found: {label}')
              return text.replace(old, new, 1)

          # types.ts
          p = Path('types.ts')
          s = p.read_text()
          s = replace_once(s,
              "  userId: number\n  notes?: string\n  linkedHealthVisitId?: number\n",
              "  userId: number\n  userIds?: number[]\n  audience?: 'users' | 'family'\n  notes?: string\n  linkedHealthVisitId?: number\n",
              'calendar multi-user type')
          p.write_text(s)

          # data.ts
          p = Path('data.ts')
          s = p.read_text()
          s = replace_once(s, '  version: 4,\n', '  version: 5,\n', 'initial data version')
          p.write_text(s)

          # utils.ts
          p = Path('utils.ts')
          s = p.read_text()
          s = replace_once(s, '    version: 4,\n', '    version: 5,\n', 'migration version')
          s = replace_once(s,
              "    calendarEvents: Array.isArray(source.calendarEvents) ? source.calendarEvents : [],\n",
              "    calendarEvents: Array.isArray(source.calendarEvents) ? source.calendarEvents.map((event: any) => {\n      const userId = Number(event?.userId || 0)\n      const rawIds = Array.isArray(event?.userIds) ? event.userIds.map(Number).filter((id: number) => id > 0) : []\n      const userIds = Array.from(new Set(rawIds.length ? rawIds : (userId ? [userId] : []))) as number[]\n      return { ...event, id: Number(event.id), userId: userId || userIds[0] || 0, userIds, audience: event?.audience === 'family' ? 'family' : 'users' }\n    }) : [],\n",
              'calendar event migration')
          p.write_text(s)

          # store.tsx
          p = Path('store.tsx')
          s = p.read_text()
          s = replace_once(s,
              "  const [activePage, setActivePage] = useState<PageKey>('home')\n",
              "  const [activePage, setActivePage] = useState<PageKey>(() => new URLSearchParams(window.location.search).has('googleCalendar') ? 'settings' : 'home')\n",
              'oauth return page')
          s = replace_once(s,
              "  const currentCloudUserRef = useRef<any>(null)\n",
              "  const currentCloudUserRef = useRef<any>(null)\n  const calendarSyncHashRef = useRef('')\n",
              'calendar sync ref')
          s = replace_once(s,
              "    const linked = linkCloudIdentity(migrateData(raw, deepClone(initialData)), profile, role)\n    suppressNextPushRef.current = true\n",
              "    const linked = linkCloudIdentity(migrateData(raw, deepClone(initialData)), profile, role)\n    calendarSyncHashRef.current = JSON.stringify(linked.calendarEvents || [])\n    suppressNextPushRef.current = true\n",
              'initialize calendar hash')
          s = replace_once(s,
              "      revisionRef.current = Number(newRevision || expected + 1)\n      setCloudStatus('synced')\n      return\n",
              "      revisionRef.current = Number(newRevision || expected + 1)\n      setCloudStatus('synced')\n      const calendarHash = JSON.stringify(snapshot.calendarEvents || [])\n      if (calendarHash !== calendarSyncHashRef.current) {\n        calendarSyncHashRef.current = calendarHash\n        void supabase.functions.invoke('google-calendar-sync', { body: { action: 'sync-all', familyId: familyIdRef.current } }).then(({ error }) => {\n          if (error) console.warn('Google Calendar sync deferred:', error.message)\n        })\n      }\n      return\n",
              'automatic Google sync')
          p.write_text(s)

          # Calendar.tsx - replace with multi-user aware calendar.
          Path('pages/Calendar.tsx').write_text(r'''import React, { useMemo, useState } from 'react'
          import { CalendarPlus, ChevronLeft, ChevronRight, Clock3, Pencil, Trash2 } from 'lucide-react'
          import type { CalendarEvent } from '../types'
          import { useFamily } from '../store'
          import { Avatar, Button, Card, EmptyState, Field, IconButton, Modal, PageIntro, Segmented } from '../ui'
          import { addDays, dayLabel, localDateISO, monthCells, monthTitle, parseISODate, weekDates } from '../utils'

          const emptyEvent = (date: string, userId: number) => ({ id: undefined, title: '', date, time: '', endTime: '', userId, userIds: [userId], audience: 'users', notes: '' })

          export default function CalendarPage() {
            const { data, authUser, upsertCalendarEvent, deleteCalendarEvent } = useFamily()
            const today = localDateISO()
            const [view, setView] = useState<'month' | 'week' | 'agenda'>('month')
            const [cursor, setCursor] = useState(today)
            const [editing, setEditing] = useState<any>(null)

            const cells = useMemo(() => monthCells(cursor), [cursor])
            const week = useMemo(() => weekDates(cursor), [cursor])
            const eventsByDate = useMemo(() => {
              const map: Record<string, CalendarEvent[]> = {}
              for (const event of data.calendarEvents) {
                map[event.date] ||= []
                map[event.date].push(event)
              }
              Object.values(map).forEach(list => list.sort((a, b) => (a.time || '').localeCompare(b.time || '')))
              return map
            }, [data.calendarEvents])

            const agenda = useMemo(
              () => data.calendarEvents.slice().sort((a, b) => `${a.date}${a.time}`.localeCompare(`${b.date}${b.time}`)),
              [data.calendarEvents]
            )

            function participantIds(event: any) {
              if (event?.audience === 'family') return data.users.map(user => user.id)
              const ids = Array.isArray(event?.userIds) && event.userIds.length ? event.userIds.map(Number) : [Number(event?.userId || 0)]
              return Array.from(new Set(ids.filter((id: number) => id > 0))) as number[]
            }

            function peopleLabel(event: any) {
              if (event?.audience === 'family') return 'Famiglia'
              const names = participantIds(event).map(id => data.users.find(user => user.id === id)?.name).filter(Boolean)
              return names.join(', ') || 'Nessuno'
            }

            function primaryUser(event: any) {
              return data.users.find(user => user.id === participantIds(event)[0])
            }

            function move(direction: -1 | 1) {
              if (view === 'month') {
                const d = parseISODate(cursor)
                d.setMonth(d.getMonth() + direction)
                setCursor(localDateISO(d))
              } else {
                setCursor(addDays(cursor, 7 * direction))
              }
            }

            function openNew(date = cursor) {
              setEditing(emptyEvent(date, authUser?.id || data.users[0]?.id || 1))
            }

            function openEdit(event: CalendarEvent) {
              setEditing({ ...event, audience: event.audience || 'users', userIds: participantIds(event) })
            }

            function toggleParticipant(id: number) {
              if (!editing) return
              const current = participantIds(editing)
              const next = current.includes(id) ? current.filter(item => item !== id) : [...current, id]
              setEditing({ ...editing, audience: 'users', userIds: next, userId: next[0] || editing.userId })
            }

            function save() {
              if (!editing?.title?.trim() || !editing?.date) return
              const audience = editing.audience === 'family' ? 'family' : 'users'
              const userIds = audience === 'family' ? data.users.map(user => user.id) : participantIds(editing)
              if (!userIds.length) return alert('Seleziona almeno una persona oppure scegli Tutta la famiglia.')
              upsertCalendarEvent({
                ...editing,
                title: editing.title.trim(),
                userId: Number(userIds[0]),
                userIds,
                audience,
                time: editing.time || '',
                endTime: editing.endTime || ''
              })
              setEditing(null)
            }

            return (
              <div className="page">
                <PageIntro eyebrow="Organizzazione" title="Calendario" description="Impegni personali, condivisi tra più persone o per tutta la famiglia." actions={<Button icon={<CalendarPlus size={18} />} onClick={() => openNew(today)}>Nuovo impegno</Button>} />

                <Card className="calendar-card">
                  <div className="calendar-toolbar">
                    <div className="calendar-toolbar__nav">
                      <IconButton label="Indietro" onClick={() => move(-1)}><ChevronLeft size={20} /></IconButton>
                      <button className="today-btn" onClick={() => setCursor(today)}>Oggi</button>
                      <IconButton label="Avanti" onClick={() => move(1)}><ChevronRight size={20} /></IconButton>
                      <h2>{view === 'month' ? monthTitle(cursor) : `${dayLabel(week[0], true)} – ${dayLabel(week[6], true)}`}</h2>
                    </div>
                    <Segmented value={view} onChange={setView} options={[{ value: 'month', label: 'Mese' }, { value: 'week', label: 'Settimana' }, { value: 'agenda', label: 'Agenda' }]} />
                  </div>

                  {view === 'month' ? (
                    <div className="month-view">
                      <div className="month-head">{['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'].map(day => <div key={day}>{day}</div>)}</div>
                      <div className="month-grid">
                        {cells.map(cell => {
                          const list = eventsByDate[cell.date] || []
                          return (
                            <div key={cell.date} className={`month-cell ${!cell.inMonth ? 'is-muted' : ''} ${cell.date === today ? 'is-today' : ''}`}>
                              <button className="month-cell__day" onClick={() => openNew(cell.date)}>{Number(cell.date.slice(8, 10))}</button>
                              <div className="month-cell__events">
                                {list.slice(0, 3).map(event => {
                                  const user = primaryUser(event)
                                  return <button key={event.id} className="calendar-event" onClick={() => openEdit(event)} style={{ '--event-color': user?.color || '#5B5BD6' } as React.CSSProperties}><span>{event.time || '•'}</span><strong>{event.title}</strong></button>
                                })}
                                {list.length > 3 ? <span className="calendar-more">+{list.length - 3} altri</span> : null}
                              </div>
                            </div>
                          )
                        })}
                      </div>
                    </div>
                  ) : null}

                  {view === 'week' ? (
                    <div className="week-calendar">
                      {week.map(date => (
                        <section key={date} className={`week-calendar__day ${date === today ? 'is-today' : ''}`}>
                          <button className="week-calendar__head" onClick={() => openNew(date)}><span>{dayLabel(date)}</span><strong>{Number(date.slice(8, 10))}</strong></button>
                          <div className="week-calendar__events">
                            {(eventsByDate[date] || []).map(event => {
                              const user = primaryUser(event)
                              return <button key={event.id} className="week-event" onClick={() => openEdit(event)} style={{ '--event-color': user?.color || '#5B5BD6' } as React.CSSProperties}><span className="week-event__time"><Clock3 size={13} /> {event.time || 'Tutto il giorno'}</span><strong>{event.title}</strong><span>{peopleLabel(event)}</span></button>
                            })}
                            {!(eventsByDate[date] || []).length ? <button className="week-empty" onClick={() => openNew(date)}>+ Aggiungi</button> : null}
                          </div>
                        </section>
                      ))}
                    </div>
                  ) : null}

                  {view === 'agenda' ? (
                    <div className="agenda-list">
                      {agenda.length ? agenda.map(event => {
                        const user = primaryUser(event)
                        return <button key={event.id} className="agenda-row" onClick={() => openEdit(event)}><div className="agenda-date"><strong>{event.date.slice(8, 10)}</strong><span>{parseISODate(event.date).toLocaleDateString('it-IT', { month: 'short' })}</span></div><div className="agenda-time">{event.time || '—'}</div><div className="agenda-copy"><strong>{event.title}</strong><span>{event.notes || 'Nessuna nota'}</span></div><div className="agenda-user">{event.audience === 'family' ? <span>Famiglia</span> : <><Avatar user={user} size="sm" /><span>{peopleLabel(event)}</span></>}</div><ChevronRight size={18} /></button>
                      }) : <EmptyState icon={<CalendarPlus size={30} />} title="Calendario vuoto" text="Aggiungi il primo impegno della famiglia." action={<Button onClick={() => openNew(today)}>Aggiungi impegno</Button>} />}
                    </div>
                  ) : null}
                </Card>

                <Modal open={!!editing} onClose={() => setEditing(null)} title={editing?.id ? 'Modifica impegno' : 'Nuovo impegno'} subtitle="Puoi assegnarlo a una persona, più persone oppure a tutta la famiglia." footer={<div className="modal-actions">{editing?.id ? <Button variant="danger" icon={<Trash2 size={17} />} onClick={() => { deleteCalendarEvent(editing.id); setEditing(null) }}>Elimina</Button> : <span />}<div className="modal-actions__right"><Button variant="ghost" onClick={() => setEditing(null)}>Annulla</Button><Button icon={<Pencil size={17} />} onClick={save}>{editing?.id ? 'Salva modifiche' : 'Crea impegno'}</Button></div></div>}>
                  {editing ? <div className="form-grid form-grid--2">
                    <Field label="Titolo" className="field--wide"><input autoFocus value={editing.title} onChange={e => setEditing({ ...editing, title: e.target.value })} placeholder="Es. Dentista, allenamento, riunione…" /></Field>
                    <Field label="Data"><input type="date" value={editing.date} onChange={e => setEditing({ ...editing, date: e.target.value })} /></Field>
                    <Field label="Ora inizio"><input type="time" value={editing.time || ''} onChange={e => setEditing({ ...editing, time: e.target.value })} /></Field>
                    <Field label="Ora fine"><input type="time" value={editing.endTime || ''} onChange={e => setEditing({ ...editing, endTime: e.target.value })} /></Field>
                    <Field label="Partecipanti" className="field--wide" hint="Famiglia include automaticamente tutti i membri attivi.">
                      <label className="toggle-row"><input type="checkbox" checked={editing.audience === 'family'} onChange={e => setEditing({ ...editing, audience: e.target.checked ? 'family' : 'users', userIds: e.target.checked ? data.users.map(user => user.id) : participantIds(editing) })} /><span>Tutta la famiglia</span></label>
                      {editing.audience !== 'family' ? <div className="settings-check-grid" style={{ marginTop: 10 }}>{data.users.map(user => { const selected = participantIds(editing).includes(user.id); return <label key={user.id} className={selected ? 'is-selected' : ''}><input type="checkbox" checked={selected} onChange={() => toggleParticipant(user.id)} /><span>{user.name}</span></label> })}</div> : <div className="callout" style={{ marginTop: 10 }}>Questo evento sarà visibile a tutti i membri della famiglia. Con Google Calendar potrà usare il calendario condiviso configurato nelle Impostazioni.</div>}
                    </Field>
                    <Field label="Note" className="field--wide"><textarea rows={4} value={editing.notes || ''} onChange={e => setEditing({ ...editing, notes: e.target.value })} placeholder="Dettagli utili…" /></Field>
                  </div> : null}
                </Modal>
              </div>
            )
          }
          ''')

          # Settings.tsx
          p = Path('pages/Settings.tsx')
          s = p.read_text()
          s = replace_once(s,
              "import { Check, ClipboardCopy, Cloud, Download, RefreshCw, RotateCcw, Upload } from 'lucide-react'\n",
              "import { CalendarDays, Check, ClipboardCopy, Cloud, Download, Link2, RefreshCw, RotateCcw, Unlink, Upload } from 'lucide-react'\n",
              'settings icons')
          marker = "type BackupHealth = {\n  ok: boolean\n  title: string\n  detail: string\n}\n"
          addition = marker + """

type GoogleCalendarChoice = {
  id: string
  summary: string
  primary?: boolean
  accessRole?: string
  timeZone?: string
}

type GoogleCalendarStatus = {
  configured: boolean
  connected: boolean
  redirectUri?: string
  connection?: {
    googleEmail?: string
    personalCalendarId?: string
    personalCalendarName?: string
    familyCalendarId?: string
    familyCalendarName?: string
    familyEventTarget?: 'personal' | 'shared' | 'both'
  } | null
}
"""
          s = replace_once(s, marker, addition, 'google settings types')
          s = replace_once(s,
              "  const [backupLoading, setBackupLoading] = useState(false)\n",
              "  const [backupLoading, setBackupLoading] = useState(false)\n  const [googleStatus, setGoogleStatus] = useState<GoogleCalendarStatus | null>(null)\n  const [googleCalendars, setGoogleCalendars] = useState<GoogleCalendarChoice[]>([])\n  const [googleBusy, setGoogleBusy] = useState(false)\n  const [googleMessage, setGoogleMessage] = useState('')\n  const [googleDraft, setGoogleDraft] = useState({ personalCalendarId: 'primary', familyCalendarId: '', familyEventTarget: 'personal' as 'personal' | 'shared' | 'both' })\n",
              'google settings state')
          s = replace_once(s,
              "  useEffect(() => {\n    void refreshBackupStatus()\n  }, [familyId, cloudAuthenticated])\n",
              "  useEffect(() => {\n    void refreshBackupStatus()\n    void refreshGoogleCalendar()\n    const params = new URLSearchParams(window.location.search)\n    const googleResult = params.get('googleCalendar')\n    if (googleResult === 'connected') setGoogleMessage('Google Calendar collegato. Scegli ora dove sincronizzare gli eventi.')\n    if (googleResult === 'error') setGoogleMessage(`Collegamento Google non riuscito${params.get('reason') ? `: ${params.get('reason')}` : '.'}`)\n    if (googleResult) window.history.replaceState({}, '', window.location.pathname)\n  }, [familyId, cloudAuthenticated])\n",
              'google settings refresh')

          function_marker = "  async function runDriveBackup() {\n"
          google_functions = """  async function callGoogleCalendar(action: string, extra: Record<string, any> = {}) {
    if (!supabase || !familyId) throw new Error('Cloud non disponibile.')
    const { data: result, error } = await supabase.functions.invoke('google-calendar-sync', { body: { action, familyId, ...extra } })
    if (error) throw new Error(error.message || 'Errore Google Calendar')
    if (result?.error) throw new Error(result.error)
    return result
  }

  async function refreshGoogleCalendar() {
    if (!supabase || !familyId || !cloudAuthenticated) {
      setGoogleStatus(null)
      setGoogleCalendars([])
      return
    }
    setGoogleBusy(true)
    try {
      const status = await callGoogleCalendar('status') as GoogleCalendarStatus
      setGoogleStatus(status)
      const connection = status?.connection
      setGoogleDraft({
        personalCalendarId: connection?.personalCalendarId || 'primary',
        familyCalendarId: connection?.familyCalendarId || '',
        familyEventTarget: connection?.familyEventTarget || 'personal'
      })
      if (status?.connected) {
        const result = await callGoogleCalendar('calendars')
        setGoogleCalendars(result?.calendars || [])
      } else setGoogleCalendars([])
    } catch (error: any) {
      setGoogleMessage(`Google Calendar: ${error?.message || 'stato non disponibile'}`)
    } finally {
      setGoogleBusy(false)
    }
  }

  async function connectGoogleCalendar() {
    setGoogleBusy(true)
    setGoogleMessage('')
    try {
      const result = await callGoogleCalendar('auth-url')
      if (!result?.url) throw new Error('URL di collegamento non disponibile.')
      window.location.assign(result.url)
    } catch (error: any) {
      setGoogleMessage(`Collegamento non riuscito: ${error?.message || 'errore sconosciuto'}`)
      setGoogleBusy(false)
    }
  }

  async function saveGoogleCalendarSettings() {
    if ((googleDraft.familyEventTarget === 'shared' || googleDraft.familyEventTarget === 'both') && !googleDraft.familyCalendarId) {
      setGoogleMessage('Scegli prima un calendario famiglia condiviso.')
      return
    }
    setGoogleBusy(true)
    setGoogleMessage('')
    try {
      await callGoogleCalendar('save-settings', googleDraft)
      setGoogleMessage('Impostazioni Google Calendar salvate e calendario sincronizzato.')
      await refreshGoogleCalendar()
    } catch (error: any) {
      setGoogleMessage(`Salvataggio non riuscito: ${error?.message || 'errore sconosciuto'}`)
    } finally {
      setGoogleBusy(false)
    }
  }

  async function syncGoogleCalendarNow() {
    setGoogleBusy(true)
    setGoogleMessage('')
    try {
      await syncNow()
      const result = await callGoogleCalendar('sync-all')
      setGoogleMessage(`Google Calendar sincronizzato${typeof result?.synced === 'number' ? `: ${result.synced} collegamenti evento aggiornati` : ''}.`)
    } catch (error: any) {
      setGoogleMessage(`Sincronizzazione non riuscita: ${error?.message || 'errore sconosciuto'}`)
    } finally {
      setGoogleBusy(false)
    }
  }

  async function disconnectGoogleCalendar() {
    if (!confirm('Scollegare il tuo account Google Calendar da VerdoFamily? Gli eventi già copiati su Google non vengono cancellati.')) return
    setGoogleBusy(true)
    setGoogleMessage('')
    try {
      await callGoogleCalendar('disconnect')
      setGoogleMessage('Account Google Calendar scollegato.')
      await refreshGoogleCalendar()
    } catch (error: any) {
      setGoogleMessage(`Scollegamento non riuscito: ${error?.message || 'errore sconosciuto'}`)
    } finally {
      setGoogleBusy(false)
    }
  }

""" + function_marker
          s = replace_once(s, function_marker, google_functions, 'google settings functions')

          card_marker = "      <Card className=\"settings-card--wide\">\n        <CardHeader title=\"Dati & backup\""
          google_card = """      <Card className="settings-card--wide">
        <CardHeader title="Google Calendar" subtitle="Ogni adulto può collegare il proprio account e scegliere dove ricevere gli eventi VerdoFamily." />
        {!cloudAuthenticated || !familyId ? <div className="callout">Accedi con il tuo account VerdoFamily cloud per collegare Google Calendar.</div> : !googleStatus ? <div className="backup-actions"><Button variant="soft" icon={<RefreshCw size={17} />} onClick={refreshGoogleCalendar} disabled={googleBusy}>{googleBusy ? 'Controllo…' : 'Verifica configurazione'}</Button></div> : !googleStatus.configured ? <>
          <div className="callout"><strong>Integrazione pronta, manca l’autorizzazione Google.</strong><br />Il backend VerdoFamily è già predisposto. Completa una sola volta la configurazione OAuth indicata da ChatGPT, poi ogni utente potrà collegare il proprio account.</div>
          {googleStatus.redirectUri ? <Field label="URI di reindirizzamento Google" hint="Va inserito tra gli URI autorizzati del client OAuth Google."><input readOnly value={googleStatus.redirectUri} /></Field> : null}
        </> : !googleStatus.connected ? <>
          <div className="callout">Collega il tuo account Google. VerdoFamily richiederà accesso agli eventi e all’elenco dei calendari, senza usare inviti automatici ai familiari.</div>
          <Button icon={<Link2 size={17} />} onClick={connectGoogleCalendar} disabled={googleBusy}>{googleBusy ? 'Collegamento…' : 'Collega Google Calendar'}</Button>
        </> : <>
          <div className="callout callout--success"><strong>✅ Google Calendar collegato</strong>{googleStatus.connection?.googleEmail ? <><br />{googleStatus.connection.googleEmail}</> : null}</div>
          <div className="form-grid form-grid--2">
            <Field label="Calendario personale" hint="Visite e impegni assegnati a te vengono copiati qui."><select value={googleDraft.personalCalendarId} onChange={e => setGoogleDraft({ ...googleDraft, personalCalendarId: e.target.value })}><option value="primary">Calendario principale Google</option>{googleCalendars.filter(item => !item.primary).map(item => <option key={item.id} value={item.id}>{item.summary}</option>)}</select></Field>
            <Field label="Calendario famiglia condiviso" hint="Opzionale: usato dagli eventi marcati Famiglia."><select value={googleDraft.familyCalendarId} onChange={e => setGoogleDraft({ ...googleDraft, familyCalendarId: e.target.value })}><option value="">Nessuno</option>{googleCalendars.map(item => <option key={item.id} value={item.id}>{item.summary}{item.primary ? ' (principale)' : ''}</option>)}</select></Field>
            <Field label="Eventi Famiglia" className="field--wide"><Segmented value={googleDraft.familyEventTarget} onChange={(familyEventTarget: any) => setGoogleDraft({ ...googleDraft, familyEventTarget })} options={[{ value: 'personal', label: 'Calendari personali' }, { value: 'shared', label: 'Solo condiviso' }, { value: 'both', label: 'Entrambi' }]} /></Field>
          </div>
          <div className="callout"><CalendarDays size={16} /> Gli eventi assegnati a più persone vengono copiati nel calendario personale di ciascun partecipante che ha collegato Google. Gli eventi “Famiglia” seguono invece la scelta qui sopra. Non vengono inviati inviti Google.</div>
          <div className="backup-actions"><Button onClick={saveGoogleCalendarSettings} disabled={googleBusy}>Salva e sincronizza</Button><Button variant="soft" icon={<RefreshCw size={17} />} onClick={syncGoogleCalendarNow} disabled={googleBusy}>Sincronizza ora</Button><Button variant="ghost" icon={<Unlink size={17} />} onClick={disconnectGoogleCalendar} disabled={googleBusy}>Scollega</Button></div>
        </>}
        {googleMessage ? <div className="callout" style={{ marginTop: 12 }}>{googleMessage}</div> : null}
      </Card>

      <Card className="settings-card--wide">
        <CardHeader title="Dati & backup""" 
          s = replace_once(s, card_marker, google_card, 'Google Calendar settings card')
          p.write_text(s)
          PY

      - name: Validate build
        run: |
          npm install
          npm run build

      - name: Commit integration
        run: |
          rm .github/workflows/apply-google-calendar-sync.yml
          git config user.name 'VerdoFamily Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
