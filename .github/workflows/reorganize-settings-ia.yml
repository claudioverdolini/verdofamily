name: Reorganize settings information architecture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reorganize-settings-ia.yml'

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply settings IA cleanup
        run: python scripts/reorganize_settings_ia.py
      - name: Build application
        run: npm ci && npm run build
      - name: Commit cleanup
        run: |
          rm .github/workflows/reorganize-settings-ia.yml scripts/reorganize_settings_ia.py
          git config user.name "VerdoFamily Automation"
          git config user.email "actions@users.noreply.github.com"
          git add pages/Settings.tsx responsive.css .github/workflows/reorganize-settings-ia.yml scripts/reorganize_settings_ia.py
          git commit -m "Reorganize settings into logical sections"
          git push
