name: Refresh dependency lock

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/refresh-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit refreshed graph
        run: npm audit --audit-level=high
      - name: Commit refreshed package lock
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "verdofamily-security-bot"
          git config user.email "security-bot@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh secure dependency lock"
          git push
