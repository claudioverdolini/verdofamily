name: Bootstrap Telegram reports integration

on:
  push:
    paths:
      - '.github/workflows/bootstrap-telegram-reports.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bring Telegram integration files from prepared branch
        run: |
          git fetch origin telegram-reports-foundation
          git checkout origin/telegram-reports-foundation -- \
            supabase/migrations/20260916102000_telegram_automatic_reports.sql \
            supabase/functions/telegram-reports/index.ts \
            components/TelegramReportsCard.tsx \
            docs/TELEGRAM_REPORTS.md

      - name: Patch settings page
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pages/Settings.tsx')
          text = path.read_text()
          import_line = "import TelegramReportsCard from '../components/TelegramReportsCard'\n"
          anchor_import = "import { Avatar, Button, Card, CardHeader, Field, PageIntro, Segmented } from '../ui'\n"
          if import_line not in text:
              if anchor_import not in text:
                  raise SystemExit('Settings import anchor not found')
              text = text.replace(anchor_import, anchor_import + import_line, 1)

          anchor = '      <Card className="settings-card--wide">\n        <CardHeader title="Dati & backup"'
          if '<TelegramReportsCard />' not in text:
              if anchor not in text:
                  raise SystemExit('Settings backup card anchor not found')
              text = text.replace(anchor, '      <TelegramReportsCard />\n\n' + anchor, 1)
          path.write_text(text)
          PY

      - name: Build application
        run: |
          npm ci
          npm run build

      - name: Commit final integration
        run: |
          git config user.name "VerdoFamily Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/bootstrap-telegram-reports.yml
          git add pages/Settings.tsx components/TelegramReportsCard.tsx docs/TELEGRAM_REPORTS.md supabase/migrations/20260916102000_telegram_automatic_reports.sql supabase/functions/telegram-reports/index.ts
          git commit -m "Integrate Telegram automatic family reports"
          git push
