name: Add notification center

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-notification-center.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add per-user notification center
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('App.tsx')
          s = app.read_text()

          s = s.replace(
            "import React, { useEffect, useMemo, useState } from 'react'",
            "import React, { useEffect, useMemo, useRef, useState } from 'react'"
          )
          if "from './utils'" not in s:
            s = s.replace(
              "import { supabase } from './supabaseClient'\n",
              "import { supabase } from './supabaseClient'\nimport { localDateISO } from './utils'\n"
            )

          marker = "function AppShell() {\n"
          component = r'''
type AppNotification = {
  id: string
  title: string
  detail: string
  page: PageKey
  createdAt: string
  priority: number
  kind: 'event' | 'deadline' | 'chore' | 'stock' | 'system' | 'update'
  label?: string
}

function NotificationCenter() {
  const { data, authUser, familyId, activePage, setActivePage, cloudStatus, updateCurrentPrefs } = useFamily()
  const [open, setOpen] = useState(false)
  const [onlyUnread, setOnlyUnread] = useState(false)
  const [nowTick, setNowTick] = useState(() => Date.now())
  const [liveUpdates, setLiveUpdates] = useState<AppNotification[]>([])
  const rootRef = useRef<HTMLDivElement>(null)
  const previousHashes = useRef<Record<string, string> | null>(null)

  const noticeKey = `verdofamily_notice_feed_${familyId || 'local'}_${authUser?.id || 'guest'}`
  const readIds = authUser?.prefs?.notificationCenterReadIds || []

  useEffect(() => {
    const timer = window.setInterval(() => setNowTick(Date.now()), 60000)
    return () => window.clearInterval(timer)
  }, [])

  useEffect(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(noticeKey) || '[]')
      const cutoff = Date.now() - (14 * 86400000)
      setLiveUpdates(Array.isArray(saved) ? saved.filter((item: AppNotification) => new Date(item.createdAt).getTime() >= cutoff).slice(0, 40) : [])
    } catch {
      setLiveUpdates([])
    }
    previousHashes.current = null
  }, [noticeKey])

  useEffect(() => {
    try {
      localStorage.setItem(noticeKey, JSON.stringify(liveUpdates.slice(0, 40)))
    } catch {}
  }, [noticeKey, liveUpdates])

  useEffect(() => {
    if (!open) return
    const onPointer = (event: MouseEvent) => {
      if (rootRef.current && !rootRef.current.contains(event.target as Node)) setOpen(false)
    }
    const onKey = (event: KeyboardEvent) => {
      if (event.key === 'Escape') setOpen(false)
    }
    document.addEventListener('mousedown', onPointer)
    document.addEventListener('keydown', onKey)
    return () => {
      document.removeEventListener('mousedown', onPointer)
      document.removeEventListener('keydown', onKey)
    }
  }, [open])

  const changeHashes = useMemo(() => ({
    calendar: JSON.stringify(data.calendarEvents),
    shopping: JSON.stringify(data.shopping),
    meals: JSON.stringify(data.mealPlans),
    chores: JSON.stringify(data.chores),
    deadlines: JSON.stringify(data.deadlines),
    todos: JSON.stringify(data.todos)
  }), [data.calendarEvents, data.shopping, data.mealPlans, data.chores, data.deadlines, data.todos])

  useEffect(() => {
    if (!previousHashes.current) {
      previousHashes.current = changeHashes
      return
    }

    const sources: Array<{ key: keyof typeof changeHashes; title: string; detail: string; page: PageKey }> = [
      { key: 'calendar', title: 'Calendario aggiornato', detail: 'Ci sono novità negli impegni della famiglia.', page: 'calendar' },
      { key: 'shopping', title: 'Lista spesa aggiornata', detail: 'La lista della spesa è stata modificata.', page: 'shopping' },
      { key: 'meals', title: 'Programma pasti aggiornato', detail: 'È cambiata la pianificazione dei pasti.', page: 'meals' },
      { key: 'chores', title: 'Compiti aggiornati', detail: 'Sono cambiati compiti o paghette.', page: 'chores' },
      { key: 'deadlines', title: 'Scadenze aggiornate', detail: 'Lo scadenziario familiare è stato modificato.', page: 'deadlines' },
      { key: 'todos', title: 'Da fare aggiornati', detail: 'La lista delle attività è stata modificata.', page: 'todos' }
    ]

    const createdAt = new Date().toISOString()
    const newItems = sources
      .filter(source => previousHashes.current?.[source.key] !== changeHashes[source.key] && activePage !== source.page)
      .map((source, index): AppNotification => ({
        id: `update-${source.key}-${Date.now()}-${index}`,
        title: source.title,
        detail: source.detail,
        page: source.page,
        createdAt,
        priority: 45,
        kind: 'update',
        label: 'Aggiornamento'
      }))

    previousHashes.current = changeHashes
    if (newItems.length) setLiveUpdates(prev => [...newItems, ...prev].slice(0, 40))
  }, [changeHashes, activePage])

  const notifications = useMemo(() => {
    if (!authUser) return [] as AppNotification[]

    const now = new Date(nowTick)
    const today = localDateISO(now)
    const items: AppNotification[] = [...liveUpdates]
    const belongsToUser = (userId?: number) => !userId || userId === authUser.id

    for (const event of data.calendarEvents) {
      if (event.date !== today) continue
      const ids = event.userIds?.length ? event.userIds : (event.userId ? [event.userId] : [])
      if (event.audience !== 'family' && ids.length && !ids.includes(authUser.id)) continue

      if (!event.time) {
        items.push({
          id: `event-${event.id}-${event.date}-all-day`,
          title: event.title,
          detail: 'Impegno previsto per oggi',
          page: 'calendar',
          createdAt: `${today}T00:01:00`,
          priority: 65,
          kind: 'event',
          label: 'Oggi'
        })
        continue
      }

      const [hour, minute] = event.time.split(':').map(Number)
      const start = new Date(now)
      start.setHours(hour || 0, minute || 0, 0, 0)
      const diffMinutes = Math.round((start.getTime() - now.getTime()) / 60000)
      if (diffMinutes > 30 || diffMinutes < -180) continue

      let detail = ''
      let label = ''
      let priority = 80
      if (diffMinutes > 1) {
        detail = `Inizia alle ${event.time}`
        label = `Tra ${diffMinutes} min`
        priority = 82
      } else if (diffMinutes >= -10) {
        detail = `Orario ${event.time}`
        label = 'Ora'
        priority = 95
      } else {
        const ago = Math.abs(diffMinutes)
        detail = `Previsto alle ${event.time}`
        label = `Da ${ago} min`
        priority = 76
      }

      items.push({
        id: `event-${event.id}-${event.date}-${event.time}`,
        title: event.title,
        detail,
        page: 'calendar',
        createdAt: start.toISOString(),
        priority,
        kind: 'event',
        label
      })
    }

    for (const deadline of data.deadlines) {
      if (deadline.done || !deadline.date || deadline.date > today || !belongsToUser(deadline.userId)) continue
      if (deadline.kind === 'medicine' || deadline.kind === 'therapy') continue
      const daysLate = Math.max(0, Math.floor((new Date(`${today}T12:00:00`).getTime() - new Date(`${deadline.date}T12:00:00`).getTime()) / 86400000))
      items.push({
        id: `deadline-${deadline.id}-${today}`,
        title: deadline.title,
        detail: daysLate ? `Scadenza superata da ${daysLate} ${daysLate === 1 ? 'giorno' : 'giorni'}` : 'Scade oggi',
        page: deadline.kind === 'visit' || deadline.kind === 'health-record' ? 'health' : 'deadlines',
        createdAt: `${today}T07:00:00`,
        priority: daysLate ? 92 : 86,
        kind: 'deadline',
        label: daysLate ? 'Scaduta' : 'Oggi'
      })
    }

    for (const chore of data.chores) {
      if (chore.done || !chore.deadline || chore.deadline > today || chore.userId !== authUser.id) continue
      items.push({
        id: `chore-${chore.id}-${today}`,
        title: chore.title,
        detail: chore.deadline < today ? 'Compito ancora da completare' : 'Compito previsto per oggi',
        page: 'chores',
        createdAt: `${today}T07:30:00`,
        priority: chore.deadline < today ? 84 : 74,
        kind: 'chore',
        label: chore.deadline < today ? 'In ritardo' : 'Oggi'
      })
    }

    if (authUser.prefs?.notifications?.shopping !== false) {
      const lowStock = data.pantry.filter(item => Number(item.minQty || 0) > 0 && Number(item.qty || 0) <= Number(item.minQty || 0))
      if (lowStock.length) {
        items.push({
          id: `stock-${today}`,
          title: lowStock.length === 1 ? `${lowStock[0].name} sotto scorta` : `${lowStock.length} prodotti sotto scorta`,
          detail: lowStock.length === 1 ? 'Controlla la dispensa o aggiungilo alla spesa.' : 'Controlla i prodotti da reintegrare.',
          page: 'shopping',
          createdAt: `${today}T08:00:00`,
          priority: 55,
          kind: 'stock',
          label: 'Dispensa'
        })
      }
    }

    if (cloudStatus === 'error') {
      items.push({
        id: `system-sync-${today}`,
        title: 'Sincronizzazione da controllare',
        detail: 'VerdoFamily non è riuscito a sincronizzare correttamente i dati.',
        page: 'settings',
        createdAt: new Date(nowTick).toISOString(),
        priority: 100,
        kind: 'system',
        label: 'Sistema'
      })
    }

    const unique = new Map<string, AppNotification>()
    for (const item of items) if (!unique.has(item.id)) unique.set(item.id, item)
    return [...unique.values()]
      .sort((a, b) => b.priority - a.priority || new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime())
      .slice(0, 60)
  }, [authUser, data, liveUpdates, cloudStatus, nowTick])

  const unread = notifications.filter(item => !readIds.includes(item.id))
  const visible = onlyUnread ? unread : notifications

  function saveReadIds(ids: string[]) {
    const merged = Array.from(new Set([...readIds, ...ids])).slice(-300)
    updateCurrentPrefs({ notificationCenterReadIds: merged })
  }

  function markRead(id: string) {
    if (!readIds.includes(id)) saveReadIds([id])
  }

  function openNotification(item: AppNotification) {
    markRead(item.id)
    setOpen(false)
    setActivePage(item.page)
  }

  function formatWhen(item: AppNotification) {
    if (item.label) return item.label
    const date = new Date(item.createdAt)
    if (Number.isNaN(date.getTime())) return ''
    if (localDateISO(date) === localDateISO()) return date.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })
    return date.toLocaleDateString('it-IT', { day: '2-digit', month: 'short' })
  }

  function iconFor(item: AppNotification) {
    if (item.kind === 'event') return <CalendarDays size={17} />
    if (item.kind === 'deadline') return <ReceiptText size={17} />
    if (item.kind === 'chore') return <CheckSquare2 size={17} />
    if (item.kind === 'stock') return <ShoppingBasket size={17} />
    if (item.kind === 'system') return <CloudOff size={17} />
    return <RefreshCw size={17} />
  }

  return <div className="notification-center" ref={rootRef}>
    <div className="notification-bell-wrap">
      <IconButton label="Notifiche" onClick={() => setOpen(value => !value)}><Bell size={19} /></IconButton>
      {unread.length ? <span className="notification-badge">{unread.length > 99 ? '99+' : unread.length}</span> : null}
    </div>

    {open ? <div className="notification-panel">
      <div className="notification-panel__head">
        <div><strong>Notifiche</strong><span>{unread.length ? `${unread.length} non ${unread.length === 1 ? 'letta' : 'lette'}` : 'Tutto sotto controllo'}</span></div>
        <IconButton label="Chiudi notifiche" onClick={() => setOpen(false)}><X size={18} /></IconButton>
      </div>

      <div className="notification-panel__toolbar">
        <div className="notification-filter">
          <button className={!onlyUnread ? 'is-active' : ''} onClick={() => setOnlyUnread(false)}>Tutte</button>
          <button className={onlyUnread ? 'is-active' : ''} onClick={() => setOnlyUnread(true)}>Non lette</button>
        </div>
        {unread.length ? <button className="notification-mark-all" onClick={() => saveReadIds(unread.map(item => item.id))}>Segna tutte lette</button> : null}
      </div>

      <div className="notification-list">
        {visible.length ? visible.map(item => {
          const isUnread = !readIds.includes(item.id)
          return <button key={item.id} className={`notification-item ${isUnread ? 'is-unread' : ''}`} onClick={() => openNotification(item)}>
            <span className={`notification-item__icon notification-item__icon--${item.kind}`}>{iconFor(item)}</span>
            <span className="notification-item__copy">
              <span className="notification-item__title">{item.title}</span>
              <span className="notification-item__detail">{item.detail}</span>
            </span>
            <span className="notification-item__meta">{formatWhen(item)}{isUnread ? <i /> : null}</span>
          </button>
        }) : <div className="notification-empty"><Bell size={25} /><strong>Nessuna notifica</strong><span>Gli impegni e gli aggiornamenti compariranno qui quando diventano rilevanti.</span></div>}
      </div>
    </div> : null}
  </div>
}

'''
          if 'function NotificationCenter()' not in s:
            if marker not in s:
              raise SystemExit('AppShell marker not found')
            s = s.replace(marker, component + marker, 1)

          old = '<SyncIndicator /><IconButton label="Notifiche"><Bell size={19} /></IconButton><button className="topbar-profile"'
          new = '<SyncIndicator /><NotificationCenter /><button className="topbar-profile"'
          if old not in s:
            raise SystemExit('topbar notification button marker not found')
          s = s.replace(old, new, 1)
          app.write_text(s)

          types = Path('types.ts')
          t = types.read_text()
          old_type = "  homeCards: Array<'today' | 'shopping' | 'deadlines' | 'wallets'>\n  notifications: {"
          new_type = "  homeCards: Array<'today' | 'shopping' | 'deadlines' | 'wallets'>\n  notificationCenterReadIds?: string[]\n  notifications: {"
          if old_type not in t:
            raise SystemExit('UserPrefs marker not found')
          t = t.replace(old_type, new_type, 1)
          types.write_text(t)

          css = Path('app.css')
          c = css.read_text()
          marker_css = '/* notification center */'
          if marker_css not in c:
            c += r'''

/* notification center */
.notification-center{position:relative}
.notification-bell-wrap{position:relative}
.notification-badge{position:absolute;right:-3px;top:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--danger);color:#fff;border:2px solid var(--surface);display:grid;place-items:center;font-size:8px;font-weight:900;line-height:1;pointer-events:none}
.notification-panel{position:absolute;right:-54px;top:calc(100% + 12px);width:min(410px,calc(100vw - 24px));max-height:min(620px,calc(100dvh - 92px));background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:0 26px 80px rgba(14,24,42,.22);overflow:hidden;display:flex;flex-direction:column;z-index:160}
.notification-panel__head{padding:15px 15px 12px 17px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.notification-panel__head>div{display:flex;flex-direction:column}
.notification-panel__head strong{font-size:15px}
.notification-panel__head span{font-size:9px;color:var(--muted);margin-top:2px}
.notification-panel__toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--surface2)}
.notification-filter{display:flex;gap:3px;background:var(--surface3);padding:3px;border-radius:10px}
.notification-filter button{border:0;background:transparent;min-height:28px;padding:0 9px;border-radius:8px;font-size:9px;font-weight:850;color:var(--muted)}
.notification-filter button.is-active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.notification-mark-all{border:0;background:transparent;color:var(--accent);font-size:9px;font-weight:850;padding:6px}
.notification-list{overflow:auto;overscroll-behavior:contain}
.notification-item{width:100%;border:0;border-bottom:1px solid var(--border);background:var(--surface);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 13px;text-align:left}
.notification-item:hover{background:var(--surface2)}
.notification-item.is-unread{background:color-mix(in srgb,var(--accent) 4%,var(--surface))}
.notification-item__icon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.notification-item__icon--deadline{color:var(--warning);background:color-mix(in srgb,var(--warning) 9%,var(--surface))}
.notification-item__icon--chore{color:#7c3aed;background:color-mix(in srgb,#7c3aed 8%,var(--surface))}
.notification-item__icon--stock{color:var(--success);background:color-mix(in srgb,var(--success) 8%,var(--surface))}
.notification-item__icon--system{color:var(--danger);background:color-mix(in srgb,var(--danger) 8%,var(--surface))}
.notification-item__icon--update{color:#2563eb;background:color-mix(in srgb,#2563eb 8%,var(--surface))}
.notification-item__copy{display:flex;flex-direction:column;min-width:0;padding-top:1px}
.notification-item__title{font-size:10px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notification-item__detail{font-size:9px;color:var(--muted);line-height:1.4;margin-top:3px}
.notification-item__meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:8px;white-space:nowrap;padding-top:2px}
.notification-item__meta i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.notification-empty{min-height:220px;padding:30px 24px;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;color:var(--muted)}
.notification-empty svg{color:var(--accent);margin-bottom:9px}
.notification-empty strong{font-size:12px;color:var(--text)}
.notification-empty span{font-size:9px;line-height:1.5;max-width:270px;margin-top:4px}

@media(max-width:820px){
  .notification-panel{position:fixed;left:10px;right:10px;top:calc(var(--topbar) + env(safe-area-inset-top) + 8px);width:auto;max-height:calc(100dvh - var(--topbar) - var(--bottom) - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 24px);border-radius:18px}
}
@media(max-width:520px){
  .notification-panel__toolbar{align-items:flex-start;flex-direction:column}
  .notification-filter{width:100%}
  .notification-filter button{flex:1}
  .notification-mark-all{align-self:flex-end}
  .notification-item{padding:11px}
}
'''
            css.write_text(c)
          PY

      - name: Build
        run: npm ci && npm run build

      - name: Commit
        run: |
          rm .github/workflows/add-notification-center.yml
          git config user.name "VerdoFamily Automation"
          git config user.email "actions@users.noreply.github.com"
          git add App.tsx types.ts app.css .github/workflows/add-notification-center.yml
          git commit -m "Add per-user notification center"
          git push
