name: VerdoFamily source snapshot

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create recovery archive
        run: |
          mkdir -p recovery-artifact
          zip -r "recovery-artifact/verdofamily-source-${GITHUB_SHA}.zip" . \
            -x '.git/*' \
            -x 'recovery-artifact/*'

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: verdofamily-source-${{ github.sha }}
          path: recovery-artifact/*.zip
          retention-days: 90
          if-no-files-found: error
