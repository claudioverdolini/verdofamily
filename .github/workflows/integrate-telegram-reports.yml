name: Integrate Telegram reports settings

on:
  push:
    paths:
      - '.github/workflows/integrate-telegram-reports.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch settings page
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pages/Settings.tsx')
          text = path.read_text()
          import_line = "import TelegramReportsCard from '../components/TelegramReportsCard'\n"
          anchor_import = "import { Avatar, Button, Card, CardHeader, Field, PageIntro, Segmented } from '../ui'\n"
          if import_line not in text:
              if anchor_import not in text:
                  raise SystemExit('Settings import anchor not found')
              text = text.replace(anchor_import, anchor_import + import_line, 1)

          anchor = '      <Card className="settings-card--wide">\n        <CardHeader title="Dati & backup"'
          if '<TelegramReportsCard />' not in text:
              if anchor not in text:
                  raise SystemExit('Settings backup card anchor not found')
              text = text.replace(anchor, '      <TelegramReportsCard />\n\n' + anchor, 1)
          path.write_text(text)
          PY

      - name: Build application
        run: |
          npm ci
          npm run build

      - name: Commit final integration
        run: |
          git config user.name "VerdoFamily Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/integrate-telegram-reports.yml
          git add pages/Settings.tsx
          git commit -m "Expose Telegram automatic reports in settings"
          git push
