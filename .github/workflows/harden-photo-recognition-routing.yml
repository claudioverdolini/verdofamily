name: Harden photo recognition routing

on:
  push:
    branches: [main]
    paths: ['.github/workflows/harden-photo-recognition-routing.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prevent product photos from falling into receipt OCR
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('pages/ShoppingPantry.tsx')
          s = p.read_text()

          marker = "  async function runOcr(file: File) {\n"
          helper = '''  function looksLikeReceiptText(text: string) {\n    const clean = text.replace(/\\s+/g, ' ').toUpperCase()\n    const priceHits = (clean.match(/\\b\\d{1,4}[,.]\\d{2}\\b/g) || []).length\n    const receiptTerms = ['TOTALE', 'SUBTOTALE', 'IMPORTO', 'SCONTRINO', 'RESTO', 'CASSA', 'P.IVA', 'IVA ', 'Q.TA', 'QTA', 'EURO']\n    const keywordHits = receiptTerms.reduce((sum, term) => sum + (clean.includes(term) ? 1 : 0), 0)\n    const usefulLines = text.split(/\\r?\\n/).map(line => line.trim()).filter(line => line.length >= 3).length\n    return priceHits >= 3 || keywordHits >= 2 || (keywordHits >= 1 && priceHits >= 1 && usefulLines >= 5)\n  }\n\n'''
          if helper.strip() not in s:
              if marker not in s:
                  raise SystemExit('runOcr marker not found')
              s = s.replace(marker, helper + marker, 1)

          old = '''  async function runOcr(file: File) {\n    setOcrBusy(true)\n    setOcrProgress(0)\n    setOcrError('')\n    try {\n      const mod: any = await import('tesseract.js')\n      const T = mod.default || mod\n      const res = await T.recognize(file, 'ita', {\n        logger: (msg: any) => {\n          if (msg?.status === 'recognizing text' && typeof msg.progress === 'number') setOcrProgress(msg.progress)\n        }\n      })\n      const text = res?.data?.text || ''\n      if (!text.trim()) throw new Error('empty')\n      setReceiptText(text)\n      analyzeReceipt(text)\n    } catch {\n      setOcrError('Non sono riuscito a leggere bene la foto. Puoi incollare il testo dello scontrino nel riquadro e premere “Analizza”.')\n    } finally {\n      setOcrBusy(false)\n    }\n  }\n'''
          new = '''  async function runOcr(file: File) {\n    setOcrBusy(true)\n    setOcrProgress(0)\n    setOcrError('')\n    try {\n      const mod: any = await import('tesseract.js')\n      const T = mod.default || mod\n      const res = await T.recognize(file, 'ita', {\n        logger: (msg: any) => {\n          if (msg?.status === 'recognizing text' && typeof msg.progress === 'number') setOcrProgress(msg.progress)\n        }\n      })\n      const text = res?.data?.text || ''\n      if (!text.trim()) throw new Error('empty')\n\n      // Product/scenery photos can produce pages of meaningless OCR. Never expose\n      // that dump to the user: move the same photo to visual product recognition.\n      if (!looksLikeReceiptText(text)) {\n        setReceiptText('')\n        setReceiptRows([])\n        setScanMode('pantry-photo')\n        await selectPantryPhoto(file)\n        setPhotoError('Questa immagine non sembra uno scontrino. L’ho preparata per il riconoscimento dei prodotti: premi “Riconosci prodotti”.')\n        return\n      }\n\n      setReceiptText(text)\n      analyzeReceipt(text)\n    } catch {\n      setOcrError('Non sono riuscito a leggere bene lo scontrino. Prova una foto più nitida oppure usa “Foto dispensa” per riconoscere direttamente i prodotti.')\n    } finally {\n      setOcrBusy(false)\n    }\n  }\n'''
          if old not in s:
              raise SystemExit('original runOcr block not found')
          s = s.replace(old, new, 1)

          # Make the two acquisition modes harder to confuse.
          s = s.replace("{ value: 'receipt', label: '🧾 Scontrino' }, { value: 'pantry-photo', label: '📷 Foto dispensa' }", "{ value: 'receipt', label: '🧾 Leggi scontrino' }, { value: 'pantry-photo', label: '📷 Riconosci prodotti' }")
          s = s.replace("'Carica gli acquisti leggendo lo scontrino.' : 'Fotografa scaffali o frigorifero e conferma ciò che viene riconosciuto.'", "'Usa questa modalità solo per una foto dello scontrino.' : 'Usa questa modalità per prodotti, scaffali, frigorifero o dispensa.'")
          p.write_text(s)

          p = Path('supabase/functions/pantry-photo-recognition/index.ts')
          s = p.read_text()
          old_prompt = "- Per ogni prodotto restituisci un nome breve in italiano. Includi marca/variante solo se chiaramente visibile e utile.\\n- Stima la quantità di confezioni effettivamente visibili. Se è dubbia usa 1 e abbassa la confidenza.\\n- unit deve essere una tra pz, g, kg, ml, l; normalmente usa pz per confezioni intere."
          new_prompt = "- Per ogni prodotto restituisci un nome breve in italiano. Includi marca/variante solo se chiaramente visibile e utile. Il testo letto sulle confezioni è solo un indizio: NON restituire lunghi frammenti OCR come nome prodotto.\\n- Riconosci anche frutta e verdura sfusa quando è visivamente identificabile. Se una bilancia/etichetta leggibile indica chiaramente il peso, puoi usare g o kg; altrimenti usa pz.\\n- Stima la quantità di confezioni effettivamente visibili. Se è dubbia usa 1 e abbassa la confidenza. Ignora prodotti quasi completamente nascosti.\\n- unit deve essere una tra pz, g, kg, ml, l; normalmente usa pz per confezioni intere."
          if old_prompt in s:
              s = s.replace(old_prompt, new_prompt, 1)
          p.write_text(s)
          PY
      - name: Build application
        run: npm ci && npm run build
      - name: Commit fix
        run: |
          rm .github/workflows/harden-photo-recognition-routing.yml
          git config user.name "VerdoFamily Automation"
          git config user.email "actions@users.noreply.github.com"
          git add pages/ShoppingPantry.tsx supabase/functions/pantry-photo-recognition/index.ts .github/workflows/harden-photo-recognition-routing.yml
          git commit -m "Route product photos to visual recognition"
          git push
