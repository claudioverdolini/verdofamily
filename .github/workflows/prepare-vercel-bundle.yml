name: Prepare Vercel deploy bundle

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-vercel-bundle.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source bundle
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const roots = [
            'App.tsx','app.css','cloud.css','data.ts','index.html','main.tsx',
            'package-lock.json','package.json','responsive.css','store.tsx',
            'supabaseClient.ts','tsconfig.json','types.ts','ui.tsx','utils.ts','vite.config.ts'
          ]
          const dirs = ['components','pages','public']
          const files = [...roots]
          function walk(dir) {
            for (const name of fs.readdirSync(dir)) {
              const p = path.join(dir,name)
              const stat = fs.statSync(p)
              if (stat.isDirectory()) walk(p)
              else files.push(p)
            }
          }
          for (const dir of dirs) walk(dir)
          const bundle = files.map(file => ({ file: file.replace(/\\/g,'/'), data: fs.readFileSync(file,'utf8') }))
          fs.writeFileSync('vercel-deploy-bundle.json', JSON.stringify({files: bundle}))
          NODE
      - name: Commit deploy bundle
        run: |
          git config user.name "verdofamily-deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add -f vercel-deploy-bundle.json
          git commit -m "Prepare verified Vercel deploy bundle"
          git push
