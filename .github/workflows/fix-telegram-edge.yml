name: Fix Telegram edge source

on:
  push:
    paths:
      - '.github/workflows/fix-telegram-edge.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Telegram start regex
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/telegram-reports/index.ts')
          s = p.read_text()
          lines = s.splitlines()
          found = False
          for i, line in enumerate(lines):
              if 'const match = text.match(' in line:
                  lines[i] = '    const match = text.match(/^\\/start(?:@\\w+)?(?:\\s+([A-Za-z0-9_-]+))?$/i);'
                  found = True
                  break
          if not found:
              raise SystemExit('Telegram start regex line not found')
          p.write_text('\n'.join(lines) + '\n')
          PY
      - name: Commit fix
        run: |
          git config user.name "VerdoFamily Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-telegram-edge.yml
          git add supabase/functions/telegram-reports/index.ts
          git commit -m "Fix Telegram bot start command parsing"
          git push
