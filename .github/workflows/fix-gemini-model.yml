name: Fix Gemini model compatibility

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-gemini-model.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Gemini model and surface backend errors
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('supabase/functions/pantry-photo-recognition/index.ts')
          s = p.read_text()
          s = s.replace('const geminiModel = Deno.env.get("GEMINI_MODEL") || "gemini-3.8-flash";', 'const geminiModel = Deno.env.get("GEMINI_MODEL") || "gemini-3.6-flash";')
          s = s.replace('          temperature: 0.1,\n', '')
          p.write_text(s)

          p = Path('pages/ShoppingPantry.tsx')
          s = p.read_text()
          old = '''    const { data: result, error } = await supabase.functions.invoke('pantry-photo-recognition', { body: { action, familyId, ...extra } })\n    if (error) throw new Error(error.message || 'Riconoscimento fotografico non disponibile.')\n    if (result?.error) throw new Error(result.error)\n    return result\n'''
          new = '''    const { data: result, error } = await supabase.functions.invoke('pantry-photo-recognition', { body: { action, familyId, ...extra } })\n    if (error) {\n      let detail = ''\n      try {\n        const payload = await (error as any)?.context?.json?.()\n        detail = String(payload?.error || payload?.message || '')\n      } catch {}\n      throw new Error(detail || error.message || 'Riconoscimento fotografico non disponibile.')\n    }\n    if (result?.error) throw new Error(result.error)\n    return result\n'''
          if old not in s:
              raise SystemExit('callPantryVision block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Build application
        run: npm ci && npm run build
      - name: Commit fix
        run: |
          rm .github/workflows/fix-gemini-model.yml
          git config user.name "VerdoFamily Automation"
          git config user.email "actions@users.noreply.github.com"
          git add pages/ShoppingPantry.tsx supabase/functions/pantry-photo-recognition/index.ts .github/workflows/fix-gemini-model.yml
          git commit -m "Fix Gemini pantry recognition model"
          git push
