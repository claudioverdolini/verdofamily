name: Add photo remove action

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-photo-remove-action.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add remove and replace controls for pantry photo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pages/ShoppingPantry.tsx')
          s = p.read_text()

          marker = "  async function analyzePantryPhoto() {\n"
          helper = '''  function clearPantryPhoto() {\n    setPhotoBusy(false)\n    setPhotoError('')\n    setPhotoRows([])\n    setPhotoPreview('')\n    setPhotoPayload(null)\n  }\n\n'''
          if helper.strip() not in s:
              if marker not in s:
                  raise SystemExit('analyzePantryPhoto marker not found')
              s = s.replace(marker, helper + marker, 1)

          old = '''              {photoPreview ? <div className="pantry-photo-preview"><img src={photoPreview} alt="Foto dispensa da analizzare" /><span>Foto pronta per il riconoscimento</span></div> : null}\n              <div className="image-source-grid image-source-grid--pantry">'''
          new = '''              {photoPreview ? <div className="pantry-photo-preview">\n                <img src={photoPreview} alt="Foto dispensa da analizzare" />\n                <div className="pantry-photo-preview__footer">\n                  <span>Foto pronta per il riconoscimento</span>\n                  <Button variant="danger" size="sm" icon={<Trash2 size={16} />} onClick={clearPantryPhoto}>Rimuovi foto</Button>\n                </div>\n              </div> : null}\n              <div className="image-source-grid image-source-grid--pantry">'''
          if old not in s:
              raise SystemExit('photo preview block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          css = Path('responsive.css')
          c = css.read_text()
          marker_css = '/* Pantry photo replace/remove */'
          if marker_css not in c:
              c += r'''

/* Pantry photo replace/remove */
.pantry-photo-preview__footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.pantry-photo-preview__footer span {
  text-align: left;
}

@media (max-width: 640px) {
  .pantry-photo-preview__footer {
    align-items: stretch;
    flex-direction: column;
  }
  .pantry-photo-preview__footer .btn {
    width: 100%;
  }
}
'''
              css.write_text(c)
          PY
      - name: Build application
        run: npm ci && npm run build
      - name: Commit fix
        run: |
          rm .github/workflows/add-photo-remove-action.yml
          git config user.name "VerdoFamily Automation"
          git config user.email "actions@users.noreply.github.com"
          git add pages/ShoppingPantry.tsx responsive.css .github/workflows/add-photo-remove-action.yml
          git commit -m "Allow removing selected pantry photo"
          git push
