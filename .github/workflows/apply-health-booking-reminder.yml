name: Apply health booking reminder

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_health_booking_reminder.py'
      - '.github/workflows/apply-health-booking-reminder.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply booking reminder patch
        run: python3 scripts/apply_health_booking_reminder.py

      - name: Validate build
        run: |
          npm install
          npm run build

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'VerdoFamily Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add types.ts store.tsx pages/Health.tsx
          git commit -m 'Add visit booking reminders'
          git push
