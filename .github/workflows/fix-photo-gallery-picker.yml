name: Fix photo gallery picker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-photo-gallery-picker.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply picker patch
        run: python .github/scripts/fix_photo_gallery.py
      - name: Build application
        run: npm ci && npm run build
      - name: Commit fix
        run: |
          rm .github/workflows/fix-photo-gallery-picker.yml
          git config user.name "VerdoFamily Automation"
          git config user.email "actions@users.noreply.github.com"
          git add pages/ShoppingPantry.tsx responsive.css .github/workflows/fix-photo-gallery-picker.yml
          git commit -m "Allow camera or gallery photo selection"
          git push
