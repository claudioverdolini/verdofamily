name: Tablet-first layout optimization

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tablet-first-layout.yml']

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize Telegram reports and tablet layout
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('components/TelegramReportsCard.tsx')
          s = p.read_text()
          old = '''      <CardHeader title={draft.id ? `Modifica “${draft.name}”` : 'Configura un report'} subtitle="Ogni report può avere orario, giorni e contenuti diversi." />
      <div className="form-grid form-grid--2">
        <Field label="Nome report"><input value={draft.name} onChange={e => setDraft({ ...draft, name: e.target.value })} placeholder="Es. Buongiorno" /></Field>
        <Field label="Orario"><input type="time" value={draft.time_local} onChange={e => setDraft({ ...draft, time_local: e.target.value })} /></Field>
        <Field label="Giorno del riepilogo"><Segmented value={String(draft.target_day_offset)} onChange={(value: string) => setDraft({ ...draft, target_day_offset: value === '1' ? 1 : 0 })} options={[{ value: '0', label: 'Oggi' }, { value: '1', label: 'Domani' }]} /></Field>
        <Field label="Contenuti"><Segmented value={draft.scope} onChange={(scope: 'personal' | 'family') => setDraft({ ...draft, scope })} options={[{ value: 'personal', label: 'I miei' }, { value: 'family', label: 'Famiglia' }]} /></Field>
      </div>

      <Field label="Giorni di invio">
        <div className="settings-check-grid">{DAY_OPTIONS.map(day => <label key={day.value} className={draft.days.includes(day.value) ? 'is-selected' : ''}><input type="checkbox" checked={draft.days.includes(day.value)} onChange={() => toggleDay(day.value)} /><span>{day.label}</span></label>)}</div>
      </Field>

      <Field label="Sezioni del report">
        <div className="settings-toggle-list">{SECTION_OPTIONS.map(section => <label key={section.key}><div><strong>{section.label}</strong><span>{section.hint}</span></div><input type="checkbox" checked={draft.sections[section.key]} onChange={() => toggleSection(section.key)} /></label>)}</div>
      </Field>

      <div className={draft.include_health ? 'callout' : 'callout'}>
        <label className="toggle-row"><input type="checkbox" checked={draft.include_health} onChange={e => setDraft({ ...draft, include_health: e.target.checked })} /><span><strong>Includi dati salute</strong><br />Disattivato di default: visite, terapie e promemoria sanitari non escono dall’app finché non lo abiliti espressamente.</span></label>
      </div>

      <div className="backup-actions">
        <Button icon={<Send size={17} />} onClick={saveSchedule} disabled={busy}>{busy ? 'Salvataggio…' : 'Salva report'}</Button>
        {draft.id ? <Button variant="soft" onClick={newSchedule} disabled={busy}>Annulla modifica</Button> : null}
        <Button variant="ghost" icon={<Unlink size={17} />} onClick={disconnect} disabled={busy}>Scollega Telegram</Button>
      </div>'''
          new = '''      <CardHeader title={draft.id ? `Modifica “${draft.name}”` : 'Configura un report'} subtitle="Impostazioni compatte e touch-friendly, pensate anche per il tablet di casa." />
      <div className="telegram-report-editor">
        <div className="telegram-report-basics">
          <Field label="Nome report"><input value={draft.name} onChange={e => setDraft({ ...draft, name: e.target.value })} placeholder="Es. Buongiorno" /></Field>
          <Field label="Orario"><input type="time" value={draft.time_local} onChange={e => setDraft({ ...draft, time_local: e.target.value })} /></Field>
          <Field label="Giorno del riepilogo"><Segmented value={String(draft.target_day_offset)} onChange={(value: string) => setDraft({ ...draft, target_day_offset: value === '1' ? 1 : 0 })} options={[{ value: '0', label: 'Oggi' }, { value: '1', label: 'Domani' }]} /></Field>
          <Field label="Contenuti"><Segmented value={draft.scope} onChange={(scope: 'personal' | 'family') => setDraft({ ...draft, scope })} options={[{ value: 'personal', label: 'I miei' }, { value: 'family', label: 'Famiglia' }]} /></Field>
        </div>

        <div className="telegram-report-body">
          <section className="telegram-report-panel">
            <div className="telegram-report-panel__head"><div><strong>Giorni di invio</strong><span>Quando deve arrivare questo report</span></div></div>
            <div className="telegram-days-grid">{DAY_OPTIONS.map(day => <label key={day.value} className={`telegram-day-chip ${draft.days.includes(day.value) ? 'is-selected' : ''}`}><input type="checkbox" checked={draft.days.includes(day.value)} onChange={() => toggleDay(day.value)} /><span>{day.label}</span></label>)}</div>
          </section>

          <section className="telegram-report-panel telegram-report-panel--sections">
            <div className="telegram-report-panel__head"><div><strong>Sezioni del report</strong><span>Scegli cosa vuoi ricevere nel messaggio</span></div></div>
            <div className="telegram-section-grid">{SECTION_OPTIONS.map(section => <label key={section.key} className={`telegram-section-option ${draft.sections[section.key] ? 'is-selected' : ''}`}><div><strong>{section.label}</strong><span>{section.hint}</span></div><input type="checkbox" checked={draft.sections[section.key]} onChange={() => toggleSection(section.key)} /></label>)}</div>
          </section>
        </div>

        <div className="callout telegram-health-option">
          <label className="toggle-row"><input type="checkbox" checked={draft.include_health} onChange={e => setDraft({ ...draft, include_health: e.target.checked })} /><span><strong>Includi dati salute</strong><br />Disattivato di default: visite, terapie e promemoria sanitari non escono dall’app finché non lo abiliti espressamente.</span></label>
        </div>

        <div className="backup-actions telegram-report-actions">
          <Button icon={<Send size={17} />} onClick={saveSchedule} disabled={busy}>{busy ? 'Salvataggio…' : 'Salva report'}</Button>
          {draft.id ? <Button variant="soft" onClick={newSchedule} disabled={busy}>Annulla modifica</Button> : null}
          <Button variant="ghost" icon={<Unlink size={17} />} onClick={disconnect} disabled={busy}>Scollega Telegram</Button>
        </div>
      </div>'''
          if old not in s:
              raise SystemExit('Telegram editor block not found')
          p.write_text(s.replace(old, new))

          css = Path('responsive.css')
          c = css.read_text()
          marker = '/* Tablet-first wall hub: shared layout rules for VerdoFamily */'
          if marker not in c:
              c += r'''

/* Tablet-first wall hub: shared layout rules for VerdoFamily */
.telegram-report-editor {
  display: grid;
  gap: 14px;
}

.telegram-report-basics {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(150px, .6fr) minmax(210px, .8fr) minmax(210px, .8fr);
  gap: 12px;
  align-items: end;
}

.telegram-report-basics .segmented {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  overflow: hidden;
}

.telegram-report-basics .segmented button {
  width: 100%;
  min-width: 0;
}

.telegram-report-body {
  display: grid;
  grid-template-columns: minmax(260px, .72fr) minmax(0, 1.28fr);
  gap: 12px;
  align-items: stretch;
}

.telegram-report-panel {
  min-width: 0;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface2);
}

.telegram-report-panel__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 11px;
}

.telegram-report-panel__head > div {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.telegram-report-panel__head strong {
  font-size: 12px;
}

.telegram-report-panel__head span {
  color: var(--muted);
  font-size: 9px;
}

.telegram-days-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 7px;
}

.telegram-day-chip {
  min-height: 48px;
  border: 1px solid var(--border2);
  border-radius: 13px;
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 10px;
  cursor: pointer;
  user-select: none;
  transition: border-color .15s, background .15s, transform .15s;
}

.telegram-day-chip:hover,
.telegram-day-chip.is-selected {
  border-color: color-mix(in srgb, var(--accent) 60%, var(--border2));
  background: color-mix(in srgb, var(--accent) 8%, var(--surface));
}

.telegram-day-chip:active {
  transform: scale(.98);
}

.telegram-day-chip input {
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
}

.telegram-day-chip span {
  font-size: 10px;
  font-weight: 850;
}

.telegram-section-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
}

.telegram-section-option {
  min-width: 0;
  min-height: 58px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--surface);
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 10px 11px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}

.telegram-section-option.is-selected {
  border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
  background: color-mix(in srgb, var(--accent) 6%, var(--surface));
}

.telegram-section-option > div {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.telegram-section-option strong {
  font-size: 11px;
}

.telegram-section-option span {
  color: var(--muted);
  font-size: 9px;
  line-height: 1.25;
}

.telegram-section-option input {
  width: 19px;
  height: 19px;
}

.telegram-health-option {
  padding: 12px 14px;
}

.telegram-report-actions {
  margin-top: 0;
  padding-top: 2px;
}

/* A 9–13 inch tablet in landscape is the primary always-on home-hub target. */
@media (min-width: 821px) and (max-width: 1280px) {
  :root {
    --sidebar: 218px;
    --topbar: 62px;
  }

  .sidebar {
    padding: 14px 10px 12px;
  }

  .sidebar__nav > button {
    min-height: 48px;
    padding: 10px 11px;
  }

  .sidebar__nav > button strong {
    font-size: 13px;
  }

  .content {
    padding: 20px 20px 38px;
  }

  .page {
    max-width: none;
  }

  .card {
    padding: 18px;
  }

  .card-header {
    margin-bottom: 14px;
  }

  input,
  select,
  textarea {
    min-height: 48px;
  }

  .btn {
    min-height: 46px;
  }

  .telegram-report-basics {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .telegram-report-body {
    grid-template-columns: minmax(235px, .78fr) minmax(0, 1.22fr);
  }

  .telegram-days-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 980px) {
  .telegram-report-body {
    grid-template-columns: minmax(0, 1fr);
  }

  .telegram-days-grid {
    grid-template-columns: repeat(7, minmax(0, 1fr));
  }
}

@media (max-width: 820px) {
  .telegram-report-editor {
    gap: 10px;
  }

  .telegram-report-basics {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px;
  }

  .telegram-report-panel {
    padding: 12px;
  }

  .telegram-days-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .telegram-section-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .telegram-report-actions {
    position: sticky;
    bottom: calc(var(--bottom) + 7px + env(safe-area-inset-bottom));
    z-index: 4;
    padding: 9px;
    margin: 0 -4px;
    border: 1px solid var(--border);
    border-radius: 15px;
    background: color-mix(in srgb, var(--surface) 95%, transparent);
    backdrop-filter: blur(16px);
    box-shadow: var(--shadow);
  }
}

@media (max-width: 560px) {
  .telegram-report-basics,
  .telegram-section-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .telegram-days-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .telegram-report-actions {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
  }

  .telegram-report-actions .btn {
    width: 100%;
  }
}
'''
              css.write_text(c)
          PY
      - name: Build application
        run: npm ci && npm run build
      - name: Commit optimized layout
        run: |
          rm .github/workflows/tablet-first-layout.yml
          git config user.name "VerdoFamily Automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/TelegramReportsCard.tsx responsive.css .github/workflows/tablet-first-layout.yml
          git commit -m "Optimize VerdoFamily for tablet-first home use"
          git push
