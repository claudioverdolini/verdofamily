name: Tablet-first layout optimization

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tablet-first-layout.yml']

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tablet layout patch
        run: python scripts/optimize_tablet_layout.py
      - name: Build application
        run: npm ci && npm run build
      - name: Commit optimized layout
        run: |
          rm .github/workflows/tablet-first-layout.yml scripts/optimize_tablet_layout.py
          git config user.name "VerdoFamily Automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/TelegramReportsCard.tsx responsive.css .github/workflows/tablet-first-layout.yml scripts/optimize_tablet_layout.py
          git commit -m "Optimize VerdoFamily for tablet-first home use"
          git push
